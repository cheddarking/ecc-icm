<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API rate limit demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102322;color:#f6f3e8;font:20px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(960px,90vw)}.eyebrow{color:#8fe0bc;font:700 17px ui-monospace,monospace;letter-spacing:3px}h1{font-size:64px;line-height:1.06;max-width:850px;margin:24px 0}p{color:#b4ccc4;max-width:690px;line-height:1.6}.bar{display:flex;gap:16px;align-items:center;margin:35px 0}input,button{font:600 22px system-ui;border-radius:12px;border:1px solid #477268;padding:18px 24px}input{color:white;background:#183a35;width:230px}button{background:#a0edc3;color:#102322;cursor:pointer}button:hover{background:#ccffe4}ol{padding:0;list-style:none;min-height:245px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start}li{padding:20px 24px;background:#1c4439;border:1px solid #448767;border-radius:12px;display:flex;flex-direction:column;gap:8px}li.blocked{background:#573e22;border-color:#d2a667}li b{font:800 36px ui-monospace,monospace}li span{font-size:16px}footer{border-top:1px solid #34544d;padding-top:20px;color:#9fbcb2;font-size:16px}
</style></head><body><main><div class="eyebrow">ECC-ICM / ONE SMALL FEATURE</div><h1>A request limit you can see.</h1><p>Send requests to a local API. The feature we're adding will allow five requests per client per minute, then ask that client to wait.</p><div class="bar"><label for="client">Client</label><input id="client" value="builder-one"><button id="send">Send request</button></div><ol id="results" aria-live="polite"></ol><footer>Local demonstration · Request IDs identify demo clients; they are not authentication.</footer></main><script>
let count=0;document.querySelector('#send').onclick=async()=>{const response=await fetch('/api/ping',{headers:{'x-client-id':document.querySelector('#client').value}});const data=await response.json();const li=document.createElement('li');if(response.status===429)li.className='blocked';const strong=document.createElement('b');strong.textContent=response.status;const label=document.createElement('span');label.textContent=`Request ${++count} · ${data.message||data.error}`;li.append(strong,label);document.querySelector('#results').append(li);};
</script></body></html>
